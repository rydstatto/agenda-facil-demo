services:
  - type: web
    name: agenda-facil-api-rydstatto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: AGENDA_DB_PATH
        value: /tmp/agenda.db
      - key: FRONTEND_ORIGINS
        value: https://rydstatto.github.io,http://localhost:8000,http://127.0.0.1:8000
      - key: ADMIN_USERNAME
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
